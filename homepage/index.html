<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Jamari Hallman Civil, Structural, VDC and BIM Engineering Portfolio"
  >

  <title>Jamari Hallman | Civil • Structural • VDC • BIM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --black: #0a0a0a;
      --white: #f5f5f2;
      --muted-white: rgba(245, 245, 242, 0.72);

      --gold: #c9a227;
      --gold-bright: #e0b93a;
      --gold-border: rgba(201, 162, 39, 0.65);

      --font:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      background: var(--black);

      color: var(--white);

      font-family: var(--font);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
    }



    /* =========================================
       MAIN HOMEPAGE
    ========================================= */

    .home-page {
      position: relative;

      width: 100%;

      min-height: 100vh;

      overflow: hidden;

      background: #05090d;
    }



    /* =========================================
       BACKGROUND IMAGE
    ========================================= */

    .hero-background {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 1;
    }


    .hero-background img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center center;

      display: block;
    }



    /* =========================================
       LEFT DARK GRADIENT
    ========================================= */

    .hero-background::before {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(3, 8, 12, 0.98) 0%,
          rgba(3, 8, 12, 0.94) 22%,
          rgba(3, 8, 12, 0.78) 37%,
          rgba(3, 8, 12, 0.46) 52%,
          rgba(3, 8, 12, 0.15) 70%,
          rgba(3, 8, 12, 0.03) 100%
        );
    }



    /* =========================================
       CINEMATIC SHADING
    ========================================= */

    .hero-background::after {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 3;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.14) 0%,
          rgba(0, 0, 0, 0.02) 46%,
          rgba(0, 0, 0, 0.28) 100%
        );
    }



    /* =========================================
       BLUEPRINT GRID
    ========================================= */

    .blueprint-overlay {
      position: absolute;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      opacity: 0.35;

      background-image:
        linear-gradient(
          rgba(23, 116, 160, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(23, 116, 160, 0.08) 1px,
          transparent 1px
        );

      background-size: 72px 72px;

      -webkit-mask-image:
        linear-gradient(
          90deg,
          black 0%,
          rgba(0, 0, 0, 0.9) 25%,
          rgba(0, 0, 0, 0.3) 50%,
          transparent 70%
        );

      mask-image:
        linear-gradient(
          90deg,
          black 0%,
          rgba(0, 0, 0, 0.9) 25%,
          rgba(0, 0, 0, 0.3) 50%,
          transparent 70%
        );
    }



    /* =========================================
       HEADER
    ========================================= */

    .top-brand {
      position: relative;

      z-index: 10;

      height: 96px;

      display: flex;

      align-items: center;

      padding:
        0
        clamp(26px, 3vw, 48px);

      border-bottom:
        1px solid
        var(--gold-border);

      background:
        rgba(4, 8, 11, 0.87);

      backdrop-filter: blur(7px);
    }



    /* =========================================
       JH LOGO
    ========================================= */

    .jh-logo {
      position: relative;

      color: var(--gold);

      font-size:
        clamp(
          2.4rem,
          3vw,
          3.3rem
        );

      font-weight: 800;

      line-height: 1;

      letter-spacing: -0.08em;

      padding-right: 24px;
    }


    .jh-logo::after {
      content: "";

      position: absolute;

      top: 50%;

      right: 0;

      width: 1px;

      height: 52px;

      transform:
        translateY(-50%);

      background:
        var(--gold-border);
    }



    /* =========================================
       MAIN HERO
    ========================================= */

    .hero-content {
      position: relative;

      z-index: 5;

      min-height:
        calc(100vh - 96px);

      display: flex;

      align-items: center;

      padding:
        clamp(42px, 6vh, 72px)
        clamp(26px, 5vw, 80px)
        clamp(100px, 12vh, 135px);
    }


    .hero-text {
      width:
        min(
          680px,
          47vw
        );
    }



    /* =========================================
       NAME
    ========================================= */

    .hero-name {
      margin: 0;

      color: var(--white);

      font-size:
        clamp(
          4.6rem,
          7.4vw,
          8.5rem
        );

      line-height: 0.89;

      letter-spacing: -0.045em;

      font-weight: 900;

      text-transform: uppercase;

      text-shadow:
        0 5px 22px
        rgba(0, 0, 0, 0.38);

      animation:
        fadeUp
        0.9s
        ease
        both;
    }



    /* =========================================
       GOLD DIVIDER
    ========================================= */

    .name-divider {
      width: 88px;

      height: 4px;

      margin:
        30px
        0
        24px;

      background:
        linear-gradient(
          90deg,
          var(--gold),
          var(--gold-bright)
        );
    }



    /* =========================================
       DISCIPLINES
    ========================================= */

    .disciplines {
      margin: 0;

      color: var(--gold);

      font-size:
        clamp(
          1.18rem,
          1.7vw,
          1.72rem
        );

      font-weight: 700;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      line-height: 1.4;

      white-space: nowrap;

      animation:
        fadeUp
        0.9s
        0.1s
        ease
        both;
    }



    /* =========================================
       TAGLINE
    ========================================= */

    .tagline {
      margin:
        28px
        0
        0;

      color: var(--white);

      font-size:
        clamp(
          1.15rem,
          1.55vw,
          1.55rem
        );

      font-weight: 700;

      letter-spacing: 0.11em;

      text-transform: uppercase;

      animation:
        fadeUp
        0.9s
        0.18s
        ease
        both;
    }



    /* =========================================
       PORTFOLIO LABEL
    ========================================= */

    .portfolio-label {
      margin:
        13px
        0
        0;

      color: var(--muted-white);

      font-size:
        clamp(
          0.98rem,
          1.15vw,
          1.15rem
        );

      font-weight: 400;

      line-height: 1.5;

      animation:
        fadeUp
        0.9s
        0.26s
        ease
        both;
    }



    /* =========================================
       VIEW PROJECTS
    ========================================= */

    .view-projects {
      margin-top: 34px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 17px;

      padding:
        19px
        28px;

      background:
        linear-gradient(
          135deg,
          var(--gold-bright),
          var(--gold)
        );

      color: var(--black);

      border:
        1px solid
        var(--gold-bright);

      border-radius: 4px;

      text-decoration: none;

      text-transform: uppercase;

      font-size: 0.98rem;

      font-weight: 800;

      letter-spacing: 0.035em;

      box-shadow:
        0 12px 30px
        rgba(201, 162, 39, 0.14);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;

      animation:
        fadeUp
        0.9s
        0.34s
        ease
        both;
    }


    .view-projects:hover {
      transform:
        translateY(-3px);

      filter:
        brightness(1.07);

      box-shadow:
        0 15px 35px
        rgba(201, 162, 39, 0.27);
    }


    .view-projects:focus-visible {
      outline:
        2px solid
        var(--white);

      outline-offset: 4px;
    }



    /* =========================================
       BUTTON ICON
    ========================================= */

    .building-icon {
      width: 26px;

      height: 26px;

      flex-shrink: 0;
    }


    .arrow {
      font-size: 1.45rem;

      line-height: 1;

      transition:
        transform
        0.25s
        ease;
    }


    .view-projects:hover .arrow {
      transform:
        translateX(5px);
    }



    /* =========================================
       BOTTOM ARROW
    ========================================= */

    .scroll-arrow {
      position: absolute;

      left: 50%;

      bottom: 30px;

      z-index: 10;

      width: 28px;

      height: 28px;

      border-right:
        4px solid
        var(--gold);

      border-bottom:
        4px solid
        var(--gold);

      transform:
        translateX(-50%)
        rotate(45deg);

      animation:
        scrollBounce
        1.8s
        ease-in-out
        infinite;
    }



    /* =========================================
       BOTTOM GOLD LINE
    ========================================= */

    .bottom-gold-line {
      position: absolute;

      left: 0;

      right: 0;

      bottom: 0;

      height: 1px;

      z-index: 10;

      background:
        var(--gold-border);
    }



    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes fadeUp {

      from {
        opacity: 0;

        transform:
          translateY(20px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    @keyframes scrollBounce {

      0%,
      100% {
        margin-bottom: 6px;
        opacity: 0.55;
      }

      50% {
        margin-bottom: -1px;
        opacity: 1;
      }

    }



    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 1050px) {

      .hero-text {
        width:
          min(
            620px,
            54vw
          );
      }


      .disciplines {
        white-space: normal;
      }


      .hero-background img {
        object-position:
          58% center;
      }

    }



    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 760px) {

      .top-brand {
        height: 78px;

        padding:
          0
          20px;
      }


      .jh-logo {
        font-size: 2.25rem;

        padding-right: 18px;
      }


      .jh-logo::after {
        height: 40px;
      }


      .hero-content {
        min-height:
          calc(100vh - 78px);

        padding:
          58px
          22px
          105px;

        align-items: center;
      }


      .hero-text {
        width: 100%;
      }


      .hero-background img {
        object-position:
          63% center;
      }


      .hero-background::before {
        background:
          linear-gradient(
            90deg,
            rgba(3, 8, 12, 0.94) 0%,
            rgba(3, 8, 12, 0.84) 48%,
            rgba(3, 8, 12, 0.58) 75%,
            rgba(3, 8, 12, 0.38) 100%
          );
      }


      .hero-name {
        font-size:
          clamp(
            3.6rem,
            16vw,
            6rem
          );
      }


      .disciplines {
        font-size:
          clamp(
            1rem,
            4.5vw,
            1.3rem
          );

        line-height: 1.5;
      }


      .tagline {
        font-size:
          clamp(
            1rem,
            4.3vw,
            1.2rem
          );
      }


      .portfolio-label {
        max-width: 330px;
      }


      .view-projects {
        padding:
          17px
          22px;
      }


      .scroll-arrow {
        bottom: 25px;
      }

    }



    /* =========================================
       SMALL MOBILE
    ========================================= */

    @media (max-width: 450px) {

      .hero-name {
        font-size:
          clamp(
            3.1rem,
            15vw,
            4.7rem
          );
      }


      .name-divider {
        margin:
          24px
          0
          20px;
      }


      .tagline {
        margin-top: 22px;
      }


      .view-projects {
        width: 100%;

        max-width: 280px;
      }

    }



    /* =========================================
       REDUCED MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation:
          none !important;

        transition:
          none !important;

        scroll-behavior:
          auto !important;
      }

    }

  </style>

</head>


<body>


  <main class="home-page">


    <!-- BACKGROUND IMAGE -->

    <div
      class="hero-background"
      aria-hidden="true"
    >

      <img
        src="homepage-engineering-hero.png"
        alt=""
      >

    </div>



    <!-- BLUEPRINT OVERLAY -->

    <div
      class="blueprint-overlay"
      aria-hidden="true"
    ></div>



    <!-- HEADER -->

    <header class="top-brand">

      <div
        class="jh-logo"
        aria-label="JH"
      >
        JH
      </div>

    </header>



    <!-- MAIN HERO -->

    <section
      class="hero-content"
      aria-label="Jamari Hallman Engineering Portfolio"
    >


      <div class="hero-text">


        <h1 class="hero-name">

          JAMARI

          <br>

          HALLMAN

        </h1>



        <div
          class="name-divider"
          aria-hidden="true"
        ></div>



        <p class="disciplines">

          CIVIL | STRUCTURAL | VDC | BIM

        </p>



        <p class="tagline">

          DESIGN. ANALYZE. BUILD.

        </p>



        <p class="portfolio-label">

          Civil &amp; Structural Engineering Portfolio

        </p>



        <a
          class="view-projects"
          href="#"
          aria-label="View Engineering Projects"
        >


          <svg
            class="building-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path d="M4 21V11L8 7V21"></path>

            <path d="M8 21V4L12 2V21"></path>

            <path d="M12 21V8L16 6V21"></path>

            <path d="M16 21V12L20 10V21"></path>

            <path d="M2 21H22"></path>

          </svg>


          <span>

            VIEW PROJECTS

          </span>


          <span
            class="arrow"
            aria-hidden="true"
          >

            →

          </span>


        </a>


      </div>


    </section>



    <!-- BOTTOM ARROW -->

    <div
      class="scroll-arrow"
      aria-hidden="true"
    ></div>



    <!-- BOTTOM GOLD LINE -->

    <div
      class="bottom-gold-line"
      aria-hidden="true"
    ></div>


  </main>


</body>

</html>
