<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jamari Hallman | Civil • Structural • VDC • BIM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>

    /* =========================================
       COLOR SYSTEM
    ========================================= */

    :root {
      --black: #0a0a0a;
      --black-soft: #121212;

      --white: #f5f5f2;
      --white-muted: rgba(245, 245, 242, 0.72);

      --gold: #c9a227;
      --gold-bright: #e0b93a;
      --gold-border: rgba(201, 162, 39, 0.65);

      --blueprint: rgba(0, 118, 173, 0.18);

      --font:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    /* =========================================
       GLOBAL RESET
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }


    /* =========================================
       HOME PAGE
    ========================================= */

    .home-page {
      width: 100%;
      min-height: 100vh;

      position: relative;
      overflow: hidden;

      background: #05090d;
    }


    /* =========================================
       BACKGROUND IMAGE

       IMPORTANT:
       This now calls the JPG file:

       homepage-engineering-hero.jpg
    ========================================= */

    .hero-background {
      position: absolute;
      inset: 0;

      background-image:
        url("homepage-engineering-hero.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      z-index: 1;
    }


    /* =========================================
       LEFT-SIDE DARK GRADIENT

       Keeps Jamari Hallman readable while
       allowing the structural/BIM model to
       remain visible on the right.
    ========================================= */

    .hero-background::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,

          rgba(3, 8, 12, 0.97) 0%,
          rgba(3, 8, 12, 0.92) 24%,
          rgba(3, 8, 12, 0.72) 39%,
          rgba(3, 8, 12, 0.32) 55%,
          rgba(3, 8, 12, 0.06) 74%,
          rgba(3, 8, 12, 0.04) 100%
        );
    }


    /* =========================================
       CINEMATIC SHADING
    ========================================= */

    .hero-background::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,

          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.02) 48%,
          rgba(0, 0, 0, 0.22) 100%
        );
    }


    /* =========================================
       BLUEPRINT OVERLAY
    ========================================= */

    .blueprint-overlay {
      position: absolute;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      opacity: 0.38;

      background-image:

        linear-gradient(
          rgba(23, 116, 160, 0.08) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(23, 116, 160, 0.08) 1px,
          transparent 1px
        );

      background-size: 72px 72px;

      mask-image:
        linear-gradient(
          90deg,

          black 0%,
          rgba(0, 0, 0, 0.9) 25%,
          rgba(0, 0, 0, 0.3) 48%,
          transparent 68%
        );
    }


    /* =========================================
       TECHNICAL CIRCLES
    ========================================= */

    .technical-circle {
      position: absolute;

      width: 120px;
      height: 120px;

      border:
        1px solid
        rgba(0, 120, 175, 0.16);

      border-radius: 50%;

      z-index: 3;

      pointer-events: none;
    }


    .circle-one {
      top: 15%;
      left: 5%;
    }


    .circle-two {
      bottom: 7%;
      left: 9%;

      width: 85px;
      height: 85px;
    }


    /* =========================================
       TOP BRAND BAR

       ONLY JH appears here.
       No second Jamari Hallman.
       No navigation.
       No hamburger.
    ========================================= */

    .top-brand {
      position: relative;

      z-index: 10;

      height: 96px;

      display: flex;
      align-items: center;

      padding:
        0
        clamp(26px, 3vw, 48px);

      border-bottom:
        1px solid
        var(--gold-border);

      background:
        rgba(4, 8, 11, 0.88);

      backdrop-filter:
        blur(7px);
    }


    /* =========================================
       JH LOGO
    ========================================= */

    .jh-logo {
      position: relative;

      color: var(--gold);

      font-size:
        clamp(
          2.4rem,
          3vw,
          3.3rem
        );

      font-weight: 800;

      line-height: 1;

      letter-spacing: -0.08em;

      padding-right: 24px;
    }


    .jh-logo::after {
      content: "";

      position: absolute;

      top: 50%;
      right: 0;

      width: 1px;
      height: 52px;

      transform:
        translateY(-50%);

      background:
        var(--gold-border);
    }


    /* =========================================
       HERO CONTENT
    ========================================= */

    .hero-content {
      position: relative;

      z-index: 5;

      min-height:
        calc(100vh - 96px);

      display: flex;

      align-items: center;

      padding:
        clamp(40px, 6vh, 70px)
        clamp(26px, 5vw, 80px)
        clamp(95px, 12vh, 130px);
    }


    .hero-text {
      width:
        min(
          660px,
          46vw
        );
    }


    /* =========================================
       MAIN NAME
    ========================================= */

    .hero-name {
      margin: 0;

      font-size:
        clamp(
          4.5rem,
          7.3vw,
          8.4rem
        );

      line-height: 0.89;

      letter-spacing: -0.045em;

      font-weight: 900;

      color: var(--white);

      text-transform: uppercase;

      text-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.35);

      animation:
        fadeUp
        0.9s
        ease
        both;
    }


    /* =========================================
       GOLD LINE UNDER NAME
    ========================================= */

    .name-divider {
      width: 88px;

      height: 4px;

      margin:
        30px
        0
        24px;

      background:
        linear-gradient(
          90deg,
          var(--gold),
          var(--gold-bright)
        );
    }


    /* =========================================
       ENGINEERING DISCIPLINES
    ========================================= */

    .disciplines {
      margin: 0;

      color: var(--gold);

      font-size:
        clamp(
          1.2rem,
          1.75vw,
          1.75rem
        );

      font-weight: 700;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      white-space: nowrap;

      animation:
        fadeUp
        0.9s
        0.1s
        ease
        both;
    }


    /* =========================================
       TAGLINE
    ========================================= */

    .tagline {
      margin:
        28px
        0
        0;

      font-size:
        clamp(
          1.15rem,
          1.55vw,
          1.55rem
        );

      font-weight: 700;

      letter-spacing: 0.11em;

      text-transform: uppercase;

      color: var(--white);

      animation:
        fadeUp
        0.9s
        0.18s
        ease
        both;
    }


    /* =========================================
       PORTFOLIO LABEL
    ========================================= */

    .portfolio-label {
      margin:
        13px
        0
        0;

      color:
        var(--white-muted);

      font-size:
        clamp(
          0.98rem,
          1.15vw,
          1.15rem
        );

      font-weight: 400;

      animation:
        fadeUp
        0.9s
        0.26s
        ease
        both;
    }


    /* =========================================
       VIEW PROJECTS BUTTON
    ========================================= */

    .view-projects {
      margin-top: 34px;

      width: fit-content;

      display: inline-flex;

      align-items: center;

      gap: 17px;

      padding:
        19px
        28px;

      background:
        linear-gradient(
          135deg,
          var(--gold-bright),
          var(--gold)
        );

      color: var(--black);

      border:
        1px solid
        var(--gold-bright);

      border-radius: 4px;

      text-decoration: none;

      text-transform: uppercase;

      font-size: 0.98rem;

      font-weight: 800;

      letter-spacing:
        0.035em;

      box-shadow:
        0 12px 30px
        rgba(201, 162, 39, 0.14);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;

      animation:
        fadeUp
        0.9s
        0.34s
        ease
        both;
    }


    .view-projects:hover {
      transform:
        translateY(-3px);

      filter:
        brightness(1.07);

      box-shadow:
        0 15px 35px
        rgba(201, 162, 39, 0.26);
    }


    .view-projects:focus-visible {
      outline:
        2px solid
        var(--white);

      outline-offset: 4px;
    }


    /* =========================================
       BUILDING ICON
    ========================================= */

    .building-icon {
      width: 26px;
      height: 26px;

      flex-shrink: 0;
    }


    .arrow {
      font-size: 1.45rem;

      line-height: 1;

      transition:
        transform
        0.25s
        ease;
    }


    .view-projects:hover .arrow {
      transform:
        translateX(5px);
    }


    /* =========================================
       BOTTOM SCROLL CHEVRON
    ========================================= */

    .scroll-arrow {
      position: absolute;

      left: 50%;
      bottom: 30px;

      z-index: 10;

      width: 28px;
      height: 28px;

      border-right:
        4px solid
        var(--gold);

      border-bottom:
        4px solid
        var(--gold);

      transform:
        translateX(-50%)
        rotate(45deg);

      animation:
        scrollBounce
        1.8s
        ease-in-out
        infinite;
    }


    /* =========================================
       BOTTOM GOLD LINE
    ========================================= */

    .bottom-gold-line {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 1px;

      z-index: 10;

      background:
        var(--gold-border);
    }


    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes fadeUp {

      from {
        opacity: 0;

        transform:
          translateY(20px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes scrollBounce {

      0%,
      100% {
        margin-bottom: 6px;

        opacity: 0.55;
      }

      50% {
        margin-bottom: -1px;

        opacity: 1;
      }
    }


    /* =========================================
       LAPTOP / TABLET
    ========================================= */

    @media (max-width: 1050px) {

      .hero-text {
        width:
          min(
            620px,
            54vw
          );
      }

      .disciplines {
        white-space: normal;
      }

      .hero-background {
        background-position:
          58% center;
      }
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 760px) {

      .top-brand {
        height: 78px;

        padding:
          0
          20px;
      }

      .jh-logo {
        font-size: 2.25rem;

        padding-right: 18px;
      }

      .jh-logo::after {
        height: 40px;
      }

      .hero-content {
        min-height:
          calc(100vh - 78px);

        padding:
          58px
          22px
          105px;

        align-items: center;
      }

      .hero-text {
        width: 100%;
      }

      .hero-background {
        background-position:
          63% center;
      }

      .hero-background::before {
        background:
          linear-gradient(
            90deg,

            rgba(3, 8, 12, 0.94) 0%,
            rgba(3, 8, 12, 0.84) 48%,
            rgba(3, 8, 12, 0.58) 75%,
            rgba(3, 8, 12, 0.38) 100%
          );
      }

      .hero-name {
        font-size:
          clamp(
            3.6rem,
            16vw,
            6rem
          );
      }

      .disciplines {
        font-size:
          clamp(
            1rem,
            4.5vw,
            1.3rem
          );

        line-height: 1.5;
      }

      .tagline {
        font-size:
          clamp(
            1rem,
            4.3vw,
            1.2rem
          );
      }

      .portfolio-label {
        max-width: 330px;
      }

      .view-projects {
        padding:
          17px
          22px;
      }

      .scroll-arrow {
        bottom: 25px;
      }
    }


    /* =========================================
       SMALL MOBILE
    ========================================= */

    @media (max-width: 450px) {

      .hero-name {
        font-size:
          clamp(
            3.1rem,
            15vw,
            4.7rem
          );
      }

      .name-divider {
        margin:
          24px
          0
          20px;
      }

      .tagline {
        margin-top: 22px;
      }
    }


    /* =========================================
       ACCESSIBILITY
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation:
          none !important;

        transition:
          none !important;

        scroll-behavior:
          auto !important;
      }
    }

  </style>

</head>


<body>


  <main class="home-page">


    <!-- =====================================
         BACKGROUND IMAGE
    ====================================== -->

    <div
      class="hero-background"
      aria-hidden="true"
    ></div>


    <!-- =====================================
         BLUEPRINT DETAILS
    ====================================== -->

    <div
      class="blueprint-overlay"
      aria-hidden="true"
    ></div>


    <div
      class="technical-circle circle-one"
      aria-hidden="true"
    ></div>


    <div
      class="technical-circle circle-two"
      aria-hidden="true"
    ></div>



    <!-- =====================================
         TOP LEFT JH LOGO
    ====================================== -->

    <header class="top-brand">

      <div
        class="jh-logo"
        aria-label="JH"
      >
        JH
      </div>

    </header>



    <!-- =====================================
         MAIN HOMEPAGE CONTENT
    ====================================== -->

    <section
      class="hero-content"
      aria-label="Jamari Hallman Engineering Portfolio"
    >


      <div class="hero-text">


        <!-- MAIN NAME -->

        <h1 class="hero-name">

          Jamari

          <br>

          Hallman

        </h1>



        <!-- GOLD DIVIDER -->

        <div
          class="name-divider"
          aria-hidden="true"
        ></div>



        <!-- DISCIPLINES -->

        <p class="disciplines">

          Civil | Structural | VDC | BIM

        </p>



        <!-- TAGLINE -->

        <p class="tagline">

          Design. Analyze. Build.

        </p>



        <!-- PORTFOLIO DESCRIPTION -->

        <p class="portfolio-label">

          Civil &amp; Structural Engineering Portfolio

        </p>



        <!-- =================================
             VIEW PROJECTS BUTTON

             FOR NOW:
             href="#"

             We will connect this to your
             existing portfolio afterward.
        ================================== -->

        <a
          class="view-projects"
          href="#"
          aria-label="View Engineering Projects"
        >


          <!-- BUILDING ICON -->

          <svg
            class="building-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path d="M4 21V11L8 7V21" />

            <path d="M8 21V4L12 2V21" />

            <path d="M12 21V8L16 6V21" />

            <path d="M16 21V12L20 10V21" />

            <path d="M2 21H22" />

          </svg>


          <span>

            View Projects

          </span>


          <span
            class="arrow"
            aria-hidden="true"
          >

            →

          </span>


        </a>


      </div>


    </section>



    <!-- =====================================
         BOTTOM SCROLL ARROW
    ====================================== -->

    <div
      class="scroll-arrow"
      aria-hidden="true"
    ></div>



    <!-- =====================================
         BOTTOM GOLD LINE
    ====================================== -->

    <div
      class="bottom-gold-line"
      aria-hidden="true"
    ></div>


  </main>


</body>

</html>
