<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamari Hallman | Engineering Portfolio</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a227;
      --bright-gold: #e0b93a;
      --white: #f5f5f2;
      --muted-white: rgba(245,245,242,.82);
    }

    body {
      background: #020b14;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    .home {
      position: relative;
      min-height: 100vh;
      overflow: hidden;

      background-image:
        linear-gradient(rgba(1,10,20,.5), rgba(1,10,20,.72)),
        url("portfolio-images/home-blueprint-background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .home-content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 30px;
      text-align: center;
    }

    .logo-mark { height: 130px; margin-bottom: 6px; }

    h1 {
      font-size: clamp(34px, 4.5vw, 62px);
      letter-spacing: .16em;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .discipline {
      color: var(--white);
      font-size: clamp(13px, 1.3vw, 19px);
      letter-spacing: .32em;
      text-transform: uppercase;
    }
    .discipline span { color: var(--gold); padding: 0 14px; }

    .gold-line {
      width: min(500px, 65%);
      height: 2px;
      margin: 26px auto 28px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--bright-gold), var(--gold), transparent);
    }

    .intro {
      max-width: 780px;
      font-size: clamp(15px, 1.4vw, 19px);
      line-height: 1.65;
      color: var(--muted-white);
      margin-bottom: 40px;
    }

    .portfolio-nav {
      width: min(1100px, 96%);
      display: flex;
      gap: 18px;
      border-top: 1px solid rgba(201,162,39,.5);
      border-bottom: 1px solid rgba(201,162,39,.5);
      padding: 24px 0;
    }
    .portfolio-nav a { flex: 1; }

    .portfolio-nav a {
      display: block;
      text-decoration: none;
    }
    .portfolio-nav img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .25s ease, filter .25s ease;
    }
    .portfolio-nav a:hover img {
      transform: translateY(-4px);
      filter: drop-shadow(0 6px 18px rgba(224,185,58,.35));
    }

    footer {
      position: absolute;
      z-index: 3;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(245,245,242,.58);
      font-size: 13px;
      letter-spacing: .06em;
    }

    @media (max-width: 750px) {
      .home-content { justify-content: flex-start; padding: 70px 20px 110px; }
      .portfolio-nav { flex-wrap: wrap; gap: 20px; }
      .portfolio-nav a { flex: 1 1 40%; }
      .logo-mark { height: 90px; }
    }
  </style>
</head>

<body>
  <main class="home">
    <div class="home-content">

      <img class="logo-mark" src="portfolio-images/jh-logo-gold.png" alt="JH">

      <h1>JAMARI HALLMAN</h1>
      <div class="discipline">CIVIL <span>/</span> STRUCTURAL ENGINEERING</div>

      <div class="gold-line"></div>

      <p class="intro">
        A collection of structural, site civil, and transportation engineering
        projects showcasing the challenges I've worked through, the solutions
        I've contributed to, and the engineering experience I've built along the way.
      </p>

      <nav class="portfolio-nav">
        <a href="structural-design.html"><img src="portfolio-images/badge-structural.png" alt="Structural Design"></a>
        <a href="land-development.html"><img src="portfolio-images/badge-land.png" alt="Land Development"></a>
        <a href="transportation.html"><img src="portfolio-images/badge-transportation.png" alt="Transportation"></a>
        <a href="mailto:jamarihallman@example.com"><img src="portfolio-images/badge-contact.png" alt="Contact"></a>
      </nav>

    </div>

    <footer>&copy; 2026 Jamari Hallman</footer>
  </main>
</body>
</html>
